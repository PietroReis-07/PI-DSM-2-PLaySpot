<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Cadastro de Proprietário</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div class="auth-card auth-card-lg">
    <div class="auth-header">
      <div class="logo-icon admin-icon">
        <i class="fa-solid fa-building-user"></i>
      </div>
      <span class="brand-name">play<span class="brand-accent">Spot</span> <small class="admin-badge">PARCEIROS</small></span>
      <p class="auth-subtitle">Cadastre-se para anunciar e gerenciar os horários das suas arenas</p>
    </div>

    <form class="auth-form" id="registerAdminForm">
      <div class="form-grid-auth">
        <!-- Dados Pessoais / Responsável -->
        <div class="form-group">
          <label for="adminName"><i class="fa-solid fa-user"></i> Nome do Responsável *</label>
          <input type="text" id="adminName" placeholder="Ex: Maria Souza" required />
        </div>

        <div class="form-group">
          <label for="adminEmail"><i class="fa-solid fa-envelope"></i> E-mail Corporativo *</label>
          <input type="email" id="adminEmail" placeholder="contato@suaarena.com.br" required />
        </div>

        <div class="form-group">
          <label for="adminPhone"><i class="fa-solid fa-phone"></i> Telefone / Comercial *</label>
          <input type="tel" id="adminPhone" placeholder="(16) 99999-9999" required />
        </div>

        <!-- RN003: Obrigatório o cadastro de CNPJ -->
        <div class="form-group">
          <label for="adminCNPJ"><i class="fa-solid fa-file-contract"></i> CNPJ do Estabelecimento * (RN003)</label>
          <input type="text" id="adminCNPJ" placeholder="00.000.000/0001-00" required />
        </div>

        <div class="form-group">
          <label for="adminCompany"><i class="fa-solid fa-building"></i> Razão Social / Nome Fantasia *</label>
          <input type="text" id="adminCompany" placeholder="Ex: Arena Franca Esportes LTDA" required />
        </div>

        <div class="form-group">
          <label for="adminCity"><i class="fa-solid fa-location-dot"></i> Cidade / Estado *</label>
          <input type="text" id="adminCity" placeholder="Ex: Franca, SP" required />
        </div>

        <div class="form-group">
          <label for="adminPassword"><i class="fa-solid fa-lock"></i> Senha *</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label for="adminConfirmPassword"><i class="fa-solid fa-lock"></i> Confirmar Senha *</label>
          <input type="password" id="adminConfirmPassword" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn btn-secondary btn-full">
        <i class="fa-solid fa-store"></i> Cadastrar como Proprietário
      </button>
    </form>

    <div class="auth-footer">
      <p>Já possui cadastro no sistema? <a href="login.html" class="auth-link">Acessar Conta</a></p>
      <p class="auth-switch">Quer reservar uma quadra? <a href="cadastro-usuario.html" class="auth-link">Cadastro para Atletas</a></p>
    </div>
  </div>
  <script>
    document.getElementById("registerAdminForm").addEventListener("submit", function (event) {
      event.preventDefault();
      window.location.href = "painel-admin.html";
    });
  </script>

</body>
</html>
