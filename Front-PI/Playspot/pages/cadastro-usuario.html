<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Cadastro de Atleta</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <span class="brand-name">play<span class="brand-accent">Spot</span></span>
      <p class="auth-subtitle">Crie sua conta para buscar e reservar arenas esportivas</p>
    </div>

    <form class="auth-form" id="registerUserForm">
      <div class="form-group">
        <label for="userName"><i class="fa-solid fa-user"></i> Nome Completo *</label>
        <input type="text" id="userName" placeholder="Ex: João Silva" required />
      </div>

      <div class="form-group">
        <label for="userEmail"><i class="fa-solid fa-envelope"></i> E-mail *</label>
        <input type="email" id="userEmail" placeholder="seuemail@exemplo.com" required />
      </div>

      <div class="form-group">
        <label for="userPhone"><i class="fa-solid fa-phone"></i> Telefone / WhatsApp *</label>
        <input type="tel" id="userPhone" placeholder="(16) 99999-9999" required />
      </div>

      <div class="form-group">
        <label for="userCPF"><i class="fa-solid fa-id-card"></i> CPF *</label>
        <input type="text" id="userCPF" placeholder="000.000.000-00" required />
      </div>

      <div class="form-group">
        <label for="userPassword"><i class="fa-solid fa-lock"></i> Senha *</label>
        <input type="password" id="userPassword" placeholder="••••••••" required />
      </div>

      <div class="form-group">
        <label for="userConfirmPassword"><i class="fa-solid fa-lock"></i> Confirmar Senha *</label>
        <input type="password" id="userConfirmPassword" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Criar Conta de Atleta
      </button>
    </form>

    <div class="auth-footer">
      <p>Já tem uma conta? <a href="login.html" class="auth-link">Fazer Login</a></p>
      <p class="auth-switch">É proprietário de arena? <a href="cadastro-admin.html" class="auth-link">Cadastrar como Proprietário</a></p>
    </div>
  </div>

</body>
</html>
