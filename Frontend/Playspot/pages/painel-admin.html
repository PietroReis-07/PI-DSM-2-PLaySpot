<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Painel do Proprietário</title>
 <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header class="header">
    <div class="container header-content">
      <div class="logo-container">
        <div class="logo-icon admin-icon"><i class="fa-solid fa-building-user"></i></div>
        <div class="logo-text">
          <span class="brand-name">play<span class="brand-accent">Spot</span></span>
          <span class="brand-sub">PAINEL DO ADMINISTRADOR</span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="painel-admin.html" class="nav-link active">Gerenciar Arenas</a>
      </nav>
      <div class="auth-buttons">
        <a href="login.html" class="btn btn-outline">Sair</a>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="admin-section">
      <div class="section-header">
        <h3>Minhas Arenas Cadastradas</h3>
        <button class="btn btn-secondary" id="btnNewArena">
          <i class="fa-solid fa-plus"></i> Cadastrar Nova Arena
        </button>
      </div>

      <!-- Formulário de Cadastro/Edição de Arena (UC003 & RN003) -->
      <div class="card-form" id="arenaFormCard">
        <h4>Cadastrar Nova Arena </h4>
        <form id="arenaForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="arenaName">Nome da Arena *</label>
              <input type="text" id="arenaName" required placeholder="Ex: Arena Pro Sports" />
            </div>

            <!-- RN003: Obrigatório o CNPJ do proprietário -->
            <div class="form-group">
              <label for="arenaCNPJ">CNPJ da Empresa * </label>
              <input type="text" id="arenaCNPJ" required placeholder="00.000.000/0001-00" />
            </div>

            <div class="form-group">
              <label for="arenaCity">Localização / Endereço *</label>
              <input type="text" id="arenaCity" required placeholder="Ex: Franca, SP" />
            </div>

            <div class="form-group">
              <label for="arenaSport">Modalidade Esportiva *</label>
              <select id="arenaSport" required>
                <option value="Beach Tennis">Beach Tennis</option>
                <option value="Futebol">Futebol Society</option>
                <option value="Padel">Padel</option>
              </select>
            </div>

            <div class="form-group">
              <label for="arenaPrice">Valor por Hora (R$) *</label>
              <input type="number" step="0.01" id="arenaPrice" required placeholder="90.00" />
            </div>

            <div class="form-group">
              <label for="arenaImage">URL da Foto</label>
              <input type="url" id="arenaImage" placeholder="https://..." />
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline" id="btnCancelArena">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar e Publicar</button>
          </div>
        </form>
      </div>

      <!-- Tabela de Gestão (CRUD) -->
      <div class="table-responsive" style="margin-top: 24px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Arena</th>
              <th>CNPJ</th>
              <th>Localização</th>
              <th>Modalidade</th>
              <th>Valor/h</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Arena Central Franca</strong></td>
              <td>12.345.678/0001-90</td>
              <td>Centro - Franca, SP</td>
              <td>Beach Tennis</td>
              <td>R$ 80,00</td>
              <td class="actions-cell">
                <button class="btn-icon text-edit" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn-icon text-danger" title="Excluir"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 PlaySpot - Todos os direitos reservados.</p>
    </div>
  </footer>
  <script>
    const arenaFormCard = document.getElementById("arenaFormCard");
    document.getElementById("btnNewArena").addEventListener("click", function () {
      arenaFormCard.scrollIntoView({ behavior: "smooth" });
      document.getElementById("arenaName").focus();
    });
    document.getElementById("btnCancelArena").addEventListener("click", function () {
      document.getElementById("arenaForm").reset();
    });
    document.getElementById("arenaForm").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Arena salva com sucesso!");
      event.target.reset();
    });
  </script>
</body>
</html>
