<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Minhas Arenas</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-nav="painel-admin.html">
  <header id="siteHeader" class="header"></header>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>

  <main class="container main-content">
    <div class="dash-hero">
      <div><h1 id="ola">Olá!</h1><p class="muted">Gerencie suas arenas e acompanhe as reservas recebidas.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="#reservas" class="btn btn-outline" id="btnIrReservas"><i class="fa-solid fa-calendar-check"></i> Reservas recebidas <span class="qtd" id="qtdFuturas">0</span></a>
        <a href="cadastro-arena.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nova arena</a>
      </div>
    </div>

    <div class="stat-grid" id="stats"></div>

    <div class="sec-titulo"><h2>Minhas arenas</h2></div>
    <div id="arenas"><div class="skel"></div></div>

    <div class="sec-titulo" id="reservas"><h2>Reservas recebidas</h2><span class="badge" id="contador">...</span></div>
    <div class="filtros">
      <div id="filtroPeriodo"></div><div class="grow"></div>
      <div style="min-width:220px"><div id="filtroArena"></div></div>
      <div style="min-width:180px"><div id="filtroStatus"></div></div>
    </div>
    <div id="lista"><div class="skel"></div></div>
  </main>

  <footer class="footer"><div class="container footer-content"><p>&copy; 2026 PlaySpot - Todos os direitos reservados.</p></div></footer>
  <script src="../js/painel-admin.js"></script>
</body>
</html>
