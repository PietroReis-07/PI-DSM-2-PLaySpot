<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Minhas Reservas</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header id="siteHeader" class="header"></header>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>

  <main class="container main-content">
    <div class="section-header"><h3>Minhas Reservas</h3><span class="badge" id="contador">...</span></div>
    <p class="muted" style="margin-bottom:14px">Cancelamento permitido até 8 horas antes do horário reservado.</p>

    <div class="filtros">
      <div id="filtroPeriodo"></div>
      <div class="grow"></div>
      <div style="min-width:200px"><div id="filtroStatus"></div></div>
    </div>

    <div id="lista"><div class="skel"></div></div>
  </main>

  <footer class="footer"><div class="container footer-content"><p>&copy; 2026 PlaySpot - Todos os direitos reservados.</p></div></footer>
  <script src="../js/minhas-reservas.js"></script>

</html>
