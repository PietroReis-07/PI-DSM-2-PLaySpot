<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlaySpot - Entrar na Conta</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">
        <i class="fa-solid fa-running"></i>
      </div>
      <span class="brand-name">play<span class="brand-accent">Spot</span></span>
      <p class="auth-subtitle">Acesse sua conta para fazer reservas ou gerenciar suas arenas</p>
    </div>

    <form class="auth-form" id="loginForm">
      <div id="loginMsg" class="alert alert-error hidden" role="alert"></div>
      <fieldset class="login-role">
        <legend>Entrar como</legend>
        <label class="role-option">
          <input type="radio" name="loginRole" value="cliente" checked />
          <span><i class="fa-solid fa-user"></i><strong>Cliente</strong><small>Reservar arenas</small></span>
        </label>
        <label class="role-option">
          <input type="radio" name="loginRole" value="proprietario" />
          <span><i class="fa-solid fa-building-user"></i><strong>Proprietário</strong><small>Gerenciar arenas</small></span>
        </label>
      </fieldset>

      <div class="form-group">
        <label for="loginEmail"><i class="fa-solid fa-envelope"></i> E-mail</label>
        <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" required />
      </div>

      <div class="form-group">
        <label for="loginPassword"><i class="fa-solid fa-lock"></i> Senha</label>
        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="••••••••" required />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="btnLogin">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar
      </button>
    </form>

    <div class="auth-footer">
      <p>Ainda não tem uma conta?</p>
      <div class="auth-register-types">
        <a href="cadastro-usuario.html" class="auth-link">Cadastrar como <strong>Atleta / Cliente</strong></a>
        <span>•</span>
        <a href="cadastro-admin.html" class="auth-link">Cadastrar como <strong>Proprietário</strong></a>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
